name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/build.ps1 build
      - run: ./scripts/build.ps1 test
